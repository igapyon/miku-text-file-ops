name: Release CLI/runtime bundles

# Publish a GitHub Release with a v* tag. This workflow checks out that tag,
# builds the release artifacts, and attaches them to the same release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-cli-runtime-bundles:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "${TAG_NAME}" in
            v*) ;;
            *)
              echo "Release tag must start with v: ${TAG_NAME}" >&2
              exit 1
              ;;
          esac

          VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          case "${VERSION}" in
            "${PACKAGE_VERSION}"|"${PACKAGE_VERSION}".*) ;;
            *)
              echo "Release tag version (${VERSION}) must match package.json version (${PACKAGE_VERSION}) or add a dot suffix such as ${PACKAGE_VERSION}.2." >&2
              exit 1
              ;;
          esac

          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Build release bundles
        run: npm run build:bundle

      - name: Verify release bundle files
        run: |
          set -euo pipefail
          test -s bundle/miku-text-file-ops.mjs
          test -s bundle/miku-text-file-ops-runtime.mjs
          test -s bundle/miku-text-file-ops-sources.tgz

      - name: Smoke test CLI bundle
        run: npm run smoke:bundle

      - name: Smoke test runtime bundle
        run: npm run smoke:runtime

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp bundle/miku-text-file-ops.mjs "release-assets/miku-text-file-ops-${RELEASE_VERSION}.mjs"
          cp bundle/miku-text-file-ops-runtime.mjs "release-assets/miku-text-file-ops-runtime-${RELEASE_VERSION}.mjs"
          cp bundle/miku-text-file-ops-sources.tgz "release-assets/miku-text-file-ops-sources-${RELEASE_VERSION}.tgz"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*
          overwrite_files: true
